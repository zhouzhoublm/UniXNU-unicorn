name: memdump-module
on:
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout device repo (module sources)
        uses: actions/checkout@v4

      - name: clone android12-5.10 kernel (shallow)
        run: |
          git clone --depth 1 --branch android12-5.10 \
            https://android.googlesource.com/kernel/common ksrc
          cd ksrc && git log --oneline -1

      - name: install toolchain (llvm-12 + deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-12 lld-12 llvm-12 libelf-dev bc flex bison
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            sudo ln -sf /usr/bin/$t-12 /usr/local/bin/$t
          done
          clang --version | head -1

      - name: prepare kernel tree (gki_defconfig)
        run: |
          cd ksrc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --disable CONFIG_KASAN \
            --disable CONFIG_MODULE_COMPRESS_GZIP \
            --disable CONFIG_MODULE_SIG_ALL \
            --enable CONFIG_DEVMEM
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 prepare modules_prepare -j$(nproc)

      - name: build physmem module
        run: |
          mkdir -p /tmp/modbuild
          cp "$GITHUB_WORKSPACE/memdump/physmem.c" "$GITHUB_WORKSPACE/memdump/Makefile" /tmp/modbuild/
          cd ksrc
          touch .scmversion 2>/dev/null || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 M=/tmp/modbuild modules -j$(nproc) || make ARCH=arm64 LLVM=1 M=/tmp/modbuild modules -j1
          ls -la /tmp/modbuild/*.ko

      - name: fix vermagic to match device kernel
        run: |
          KO=/tmp/modbuild/physmem.ko
          TARGET="5.10.136-android12-9-00021-g821df8f5bd36-ab9585204"
          python3 - "$KO" "$TARGET" <<'PY'
          import sys, pathlib
          ko = bytearray(pathlib.Path(sys.argv[1]).read_bytes())
          tgt = sys.argv[2].encode()
          i = ko.find(b'vermagic=')
          assert i >= 0, 'no vermagic'
          j = ko.find(b'\x00', i)
          old_len = j - i
          new = b'vermagic=' + tgt[:len(old)-9].ljust(len(old)-9, b' ') + b'\x00'
          ko[i:j+1] = new
          pathlib.Path(sys.argv[1]).write_bytes(bytes(ko))
          print('vermagic patched')
          PY
          mkdir -p out && cp "$KO" out/physmem.ko

      - name: upload module
        uses: actions/upload-artifact@v4
        with:
          name: physmem-ko
          path: out/physmem.ko
