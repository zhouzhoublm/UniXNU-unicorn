name: firmware-unicorn

# 用 GitHub Actions 的 ubuntu runner 编 unicornPkg 固件，产出 SILICIUM_UEFI.fd。
#
# 为什么 checkout 之后还要重建子模块：uefi-unicorn 上游把 Mu_Basecore /
# Common/Mu / Common/Mu_OEM_Sample / Silicium-ACPI / Binaries / openssl 六个
# 子模块提交成了指向作者本机 /root/uefi-unicorn/... 的符号链接（git mode
# 120000），在任何 CI 上都是断链。这里按 .gitmodules 的 URL/分支用真 git clone
# 重建（stuart 校验子模块必须是合法 git 仓库），openssl 固定 commit
# 67b5686b4419b4cb8caa502711c41815f5279751。
#
# 产物用法：下载 SILICIUM_UEFI.fd 后放到 uefi-unicorn/Build/unicornPkg/
# RELEASE_CLANGPDB/FV/，再在本地跑 scripts/make-m3-image.sh 打包 boot 镜像。

on:
  workflow_dispatch:
    inputs:
      target:
        description: EDK II build target
        type: choice
        options: [RELEASE, DEBUG]
        default: RELEASE

permissions:
  contents: read

jobs:
  firmware:
    name: build unicornPkg
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: checkout uefi-unicorn
        uses: actions/checkout@v4
        with:
          repository: zhouzhoublm/uefi-unicorn
          ref: master
          path: uefi-unicorn

      - name: replace broken submodule symlinks with real git clones
        working-directory: uefi-unicorn
        run: |
          set -euo pipefail
          clone () {
            local path="$1" repo="$2" ref="$3"
            rm -f "$path"
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              # a specific commit: blobless clone then detach
              git clone -q --filter=blob:none "https://github.com/${repo}.git" "$path"
              git -C "$path" checkout -q --detach "$ref"
            else
              git clone -q --depth 1 --branch "$ref" "https://github.com/${repo}.git" "$path"
            fi
            echo "  $path <- $repo@$ref ($(git -C "$path" rev-parse --short HEAD))"
          }
          clone Mu_Basecore microsoft/mu_basecore release/202608
          # Mu_Basecore has its own nested submodules (mipisyst, libfdt, libspdm,
          # brotli, ...) — MdePkg.dec includes headers from MipiSysTLib/mipisyst,
          # so without these the EDK2 build dies at "File/directory not found".
          git -C Mu_Basecore submodule update --init --recursive --depth 1
          clone Common/Mu microsoft/mu_plus release/202608
          clone Common/Mu_OEM_Sample microsoft/mu_oem_sample release/202608
          clone Silicium-ACPI Project-Silicium/Silicium-ACPI main
          clone Binaries Project-Silicium/Device-Binaries main
          clone Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl \
            openssl/openssl 67b5686b4419b4cb8caa502711c41815f5279751

      - name: install build environment
        working-directory: uefi-unicorn
        run: |
          export CI_BUILD=true
          bash ./setup_env.sh -p apt

      - name: adapt AsmMacroLib patch to release/202608
        working-directory: uefi-unicorn
        # 上游 release/202608 给 AsmMacroLib.h 加了 #ifdef __ELF__（PE 路径已用
        # .text$ 解决段合并问题），旧补丁 hunk 上下文漂移打不上。按上游新结构
        # 重生成等效补丁（__ELF__ 分支 .text. ## Name -> .text，保持作者原意）。
        # 其余 5 个补丁对当前 HEAD 均可干净应用（本地已验证）。
        run: |
          set -euo pipefail
          printf '%s' \
            'ZGlmZiAtLWdpdCBhL01kZVBrZy9JbmNsdWRlL0FBcmNoNjQvQXNtTWFjcm9MaWIuaCBiL01kZVBrZy9JbmNsdWRlL0FBcmNo' \
            'NjQvQXNtTWFjcm9MaWIuaAppbmRleCA0MGNiZDUxLi5lYmE5OTVlIDEwMDY0NAotLS0gYS9NZGVQa2cvSW5jbHVkZS9BQXJj' \
            'aDY0L0FzbU1hY3JvTGliLmgKKysrIGIvTWRlUGtnL0luY2x1ZGUvQUFyY2g2NC9Bc21NYWNyb0xpYi5oCkBAIC00MCwxMCAr' \
            'NDAsMTAgQEAKIC8vIENMQU5HUERCIGRvZXMgbm90IG1lcmdlIEVMRiBzdHlsZSBzZWN0aW9ucyB3aXRoIC50ZXh0LjxuYW1l' \
            'PiBhbnkgbG9uZ2VyLA0KIC8vIHdoaWNoIGdyZWF0bHkgYWZmZWN0cyB0aGUgYmluYXJ5IHNpemUsIHNvIHdlIG5lZWQgdG8g' \
            'bmFtZSBzZWN0aW9ucyBpbiBhIFBFIGZyaWVuZGx5IHdheQ0KICNpZmRlZiBfX0VMRl9fDQotI2RlZmluZSBBU01fRlVOQyhO' \
            'YW1lKSAgX0FTTV9GVU5DKEFTTV9QRlgoTmFtZSksIC50ZXh0LiAjIyBOYW1lKQ0KKyNkZWZpbmUgQVNNX0ZVTkMoTmFtZSkg' \
            'IF9BU01fRlVOQyhBU01fUEZYKE5hbWUpLCAudGV4dCkNCiANCiAjZGVmaW5lIEFTTV9GVU5DX0FMSUdOKE5hbWUsIEFsaWdu' \
            'KSAgXA0KLSAgX0FTTV9GVU5DX0FMSUdOKEFTTV9QRlgoTmFtZSksIC50ZXh0LiAjIyBOYW1lLCBBbGlnbikNCisgIF9BU01f' \
            'RlVOQ19BTElHTihBU01fUEZYKE5hbWUpLCAudGV4dCwgQWxpZ24pDQogI2Vsc2UNCiAjZGVmaW5lIEFTTV9GVU5DKE5hbWUp' \
            'ICBfQVNNX0ZVTkMoQVNNX1BGWChOYW1lKSwgLnRleHQkICMjIE5hbWUpDQogDQo=' \
            | base64 -d > Resources/MuPatches/AsmMacroLib.patch
          cd Mu_Basecore
          git apply --check ../Resources/MuPatches/AsmMacroLib.patch
          echo "AsmMacroLib.patch (adapted) applies clean"

      - name: detach AdvLogDxe from AdvancedLogger DebugLib
        working-directory: uefi-unicorn
        # Round-4 link failure: duplicate symbol AdvancedLoggerWrite. AdvLogDxe
        # vendors the DxeCore-instance sources itself (AdvancedLoggerCommon.c
        # defines the plain writer), but as a DXE_DRIVER its DebugLib resolves
        # to BaseDebugLibAdvancedLogger, which requires the Dxe/AdvancedLoggerLib
        # instance — whose own AdvancedLoggerWrite then collides. Per-component
        # override gives AdvLogDxe a null DebugLib; the vendored DxeCore instance
        # still installs the protocol for every other DXE driver.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Platforms/Xiaomi/unicornPkg/unicorn.dsc')
          t = p.read_text()
          old = '  unicornPkg/Drivers/AdvLogDxe/AdvLogDxe.inf\n'
          new = (
            '  unicornPkg/Drivers/AdvLogDxe/AdvLogDxe.inf {\n'
            '    <LibraryClasses>\n'
            '      DebugLib|MdePkg/Library/BaseDebugLibNull/BaseDebugLibNull.inf\n'
            '  }\n'
          )
          assert old in t, 'AdvLogDxe component entry not found in unicorn.dsc'
          p.write_text(t.replace(old, new, 1))
          print('unicorn.dsc: AdvLogDxe DebugLib detached')
          PY

      - name: provide unicorn.dtb under Resources/DTBs
        working-directory: uefi-unicorn
        # build_uefi.py expects Resources/DTBs/<device>.dtb (Pong naming); this
        # fork only carries sm8475-xiaomi-unicorn.dtb. Copy from the platform
        # package FdtBlob, which is the same file make-m3-image.sh references.
        run: |
          set -euo pipefail
          cp Platforms/Xiaomi/unicornPkg/FdtBlob/sm8475-xiaomi-unicorn.dtb \
             Resources/DTBs/unicorn.dtb
          ls -l Resources/DTBs/

      - name: build unicornPkg
        working-directory: uefi-unicorn
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target || 'RELEASE' }}"
          python3 build_uefi.py -d unicorn -r "$TARGET" -c
          FD="Build/unicornPkg/${TARGET}_CLANGPDB/FV/SILICIUM_UEFI.fd"
          [ -f "$FD" ] || { echo "FD not found: $FD"; find Build -name '*.fd' 2>/dev/null; exit 1; }
          ls -l "$FD"
          sha256sum "$FD"

      - name: upload firmware volume
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-fd-${{ inputs.target || 'RELEASE' }}
          path: uefi-unicorn/Build/unicornPkg/**/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
          retention-days: 30
